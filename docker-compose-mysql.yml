version: '3.4'

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # 数据库配置 - 使用本地 MySQL
      SQL_DSN: "newapi:eRFw8MDCRxzaTL3z@tcp(host.docker.internal:3306)/newapi?charset=utf8mb4&parseTime=True&loc=Local"
      
      # Redis配置 - 使用容器内 Redis
      REDIS_CONN_STRING: "redis://:newapi_redis_password@redis:6379"
      
      # Session密钥 - 多机部署必需
      SESSION_SECRET: "aUYf8D3eL7mP9sQ2rT5wX1zC4vB6nG8hK1jM3nP5qR7tV9wY1zD2"
      
      # 加密密钥 - 使用Redis时必需
      CRYPTO_SECRET: "xM5nK2jH8gF4dS1aZ0pO9iU8yT7rE5wQ3eW1qR4tY6"
      
      # 时区
      TZ: Asia/Shanghai
      
      # 启用内存缓存
      MEMORY_CACHE_ENABLED: true
      
      # 错误日志记录
      ERROR_LOG_ENABLED: true
      
      # 批量更新
      BATCH_UPDATE_ENABLED: true
      
      # 节点名称
      NODE_NAME: new-api-node-1
      
      # 流式超时
      STREAMING_TIMEOUT: 300

    depends_on:
      - redis
    networks:
      - new-api-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: new-api-redis
    restart: always
    command: ["redis-server", "--requirepass", "newapi_redis_password"]
    networks:
      - new-api-network
    ports:
      - "6379:6379"

volumes:
  new-api-data:

networks:
  new-api-network:
    driver: bridge
